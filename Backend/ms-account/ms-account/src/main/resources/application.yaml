spring:
  application:
    name: ms-account

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format-sql: true

  datasource:
    url: jdbc:mysql://localhost:3306/db_account
    username: root
    password: 
    driver-class-name: com.mysql.cj.jdbc.Driver

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/  

server:
  port: 0


